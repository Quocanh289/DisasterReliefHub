services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: disaster-relief-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disaster_relief}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-disaster_relief}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: disaster-relief-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/Presentation/DisasterRelief.Api/Dockerfile
    container_name: disaster-relief-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: 'Host=postgres;Port=5432;Database=${POSTGRES_DB:-disaster_relief};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}'
      Jwt__Issuer: DisasterReliefCoordination
      Jwt__Audience: DisasterReliefCoordination.Client
      Jwt__Key: ${JWT_KEY:-local-compose-development-key-change-before-deploy-2026}
      Jwt__ExpiryMinutes: '60'
      Database__ApplyMigrationsOnStartup: 'true'
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
